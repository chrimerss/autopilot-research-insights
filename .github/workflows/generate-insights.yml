name: Generate research insights

# Event-driven: pushing a paper PDF into interest/ triggers analysis + a PR.
on:
  push:
    paths:
      - "interest/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required to assume the AWS IAM role via OIDC (Bedrock provider)

# Queue, do NOT cancel: cancelling a run mid-flight while another push arrives could
# silently drop an insight (the cancelled run owned that push's diff). Serialize instead.
concurrency:
  group: insights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2 # need github.event.before..HEAD for the Fork-C push-diff scoping

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Only runs for the Bedrock provider: assumes the IAM role via GitHub OIDC
      # (no long-lived AWS keys). Set the AWS_ROLE_ARN + AWS_REGION repo variables.
      - name: Configure AWS credentials (Bedrock)
        if: ${{ vars.INSIGHTS_PROVIDER == 'bedrock' }}
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Analyze new papers
        id: run
        run: python scripts/analyze_paper.py
        env:
          # Provider: 'bedrock' (AWS) or 'anthropic' (direct API). Default: anthropic.
          INSIGHTS_PROVIDER: ${{ vars.INSIGHTS_PROVIDER || 'anthropic' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # Direct-API key (unused when provider=bedrock). Secret only via env; masked.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model id. Bedrock needs a Bedrock model/inference-profile id (set the
          # INSIGHTS_MODEL repo variable); direct API defaults to Sonnet.
          INSIGHTS_MODEL: ${{ vars.INSIGHTS_MODEL || 'claude-sonnet-4-6' }}
          BEFORE_SHA: ${{ github.event.before }}

      - name: Open pull request
        # Only when at least one insight was generated. If the analyze step fails
        # (all papers errored → exit 1), this step is skipped and the job fails red.
        if: ${{ steps.run.outputs.count != '0' && steps.run.outputs.count != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # One run-scoped branch carries ALL new insights from this push.
          branch: insights/run-${{ github.run_id }}
          title: "Insights: ${{ steps.run.outputs.summary }}"
          commit-message: "Add ${{ steps.run.outputs.count }} research insight(s) [run ${{ github.run_id }}]"
          body: |
            Automated research insight(s) — please review before merging. No auto-merge.

            Added:
            ${{ steps.run.outputs.added_list }}

            Generated by `scripts/analyze_paper.py`. Each insight is grounded in your
            publications (`_data/publications.yml`); merging it updates the dashboard.
          # Success-scoped paths emitted by the script via the $GITHUB_OUTPUT heredoc
          # (one path per line, incl. each slug's .sha256). NOT a blind interest/** sweep.
          add-paths: ${{ steps.run.outputs.add_paths }}
          delete-branch: true
