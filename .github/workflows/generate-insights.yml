name: Generate research insights

# Event-driven: pushing a paper PDF into interest/ triggers analysis and commits
# the generated insight straight to main (the live site updates automatically).
on:
  push:
    paths:
      - "interest/**"
  workflow_dispatch: {}

permissions:
  contents: write # commit the generated insight to main
  pages: write    # explicitly trigger the Pages rebuild after the bot commit
  id-token: write # assume the AWS IAM role via OIDC (Bedrock provider)

# Queue, do NOT cancel: cancelling a run mid-flight while another push arrives could
# silently drop an insight (the cancelled run owned that push's diff). Serialize instead.
concurrency:
  group: insights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: needed for the Fork-C push-diff scoping AND for a clean
          # rebase before committing the insight back to main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Only runs for the Bedrock provider: assumes the IAM role via GitHub OIDC
      # (no long-lived AWS keys). Set the AWS_ROLE_ARN + AWS_REGION repo variables.
      - name: Configure AWS credentials (Bedrock)
        if: ${{ vars.INSIGHTS_PROVIDER == 'bedrock' }}
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Analyze new papers
        id: run
        run: python scripts/analyze_paper.py
        env:
          # Provider: 'bedrock' (AWS) or 'anthropic' (direct API). Default: anthropic.
          INSIGHTS_PROVIDER: ${{ vars.INSIGHTS_PROVIDER || 'anthropic' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # Direct-API key (unused when provider=bedrock). Secret only via env; masked.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model id. Bedrock needs a Bedrock model/inference-profile id (set the
          # INSIGHTS_MODEL repo variable); direct API defaults to Sonnet.
          INSIGHTS_MODEL: ${{ vars.INSIGHTS_MODEL || 'claude-sonnet-4-6' }}
          BEFORE_SHA: ${{ github.event.before }}

      - name: Commit insights to main
        # Only when at least one insight was generated. If the analyze step fails
        # (all papers errored → exit 1), this step is skipped and the job fails red,
        # so a failed run never commits a partial/garbage insight.
        if: ${{ steps.run.outputs.count != '0' && steps.run.outputs.count != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitignore excludes _site/.venv/__pycache__/etc., so -A stages exactly the
          # generated artifacts: _insights/*, interest/<slug>/{paper.md,.sha256},
          # assets/figures/*, and any _data/subjects.yml / project.html updates.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "Add ${{ steps.run.outputs.count }} research insight(s) [run ${{ github.run_id }}]"
          # Rebase onto any concurrent change before pushing to keep main linear.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger Pages build
        # A GITHUB_TOKEN push does NOT auto-trigger the Pages build, so request one
        # explicitly. Without this the commit lands but the live site wouldn't refresh.
        if: ${{ steps.run.outputs.count != '0' && steps.run.outputs.count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
