<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title">{{ site.title }}</h1>
      <p class="site-tagline">{{ site.description }}</p>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        Auto-generated by
        <a href="https://github.com/chrimerss/autopilot-research-insights" target="_blank" rel="noopener">autopilot-research-insights</a>.
        Insights are AI-generated drafts for the author's review.
        <a href="{{ '/project.html' | relative_url }}">About this project</a>.
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/tabs.js' | relative_url }}" defer></script>
</body>
</html>
